stages:
  - test
  - sbom

default:
  tags:
    - flarenetwork
  artifacts:
    expire_in: 3 days

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG

variables:
  GOLANG_VERSION: "1.27.2-trixie@sha256:47667934874913a449b96faa7ef4777fa285d9ec29126ee80ed61c45b7cccf0e"
  GOLINT_VERSION: "v2.14.0"

include:
  - component: gitlab.com/flarenetwork/ci-components-private/lgtm@2
  - component: gitlab.com/flarenetwork/ci-components-private/dependency-track@2
  - component: gitlab.com/flarenetwork/ci-components-private/lint-dockerfile@2
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml
  - component: gitlab.com/flarenetwork/ci-components-private/lint-go@2
    inputs:
      go_project_dir: "go-client"
      go_version: "1.27.2"
      golangci_version: "$GOLINT_VERSION"
      golangci_config_file: ".golangci.yml"
  - component: gitlab.com/flarenetwork/ci-components-private/test-go@2
    inputs:
      go_project_dir: "go-client"
      go_version: "1.27.2"
      # the coverage converter runs inside go-client, so it needs the go.mod Go version
      cobertura_go_version: "1.27.2"
      go_test_command: |
        go test -short -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic -coverpkg=$(go list ./... | grep -v contracts-interface | paste -sd, -) ./...
  - component: gitlab.com/flarenetwork/ci-components-private/lint-python@2

# scenario suite in go-client/tests/e2e: runs the client against the real
# contracts on a ganache chain and verifies every mined submission
test-go-client-e2e:
  stage: test
  # GitLab's shared runners run the privileged docker:dind service, the
  # flarenetwork Kubernetes runner does not
  tags: [saas-linux-small-amd64]
  image: golang:${GOLANG_VERSION}
  services:
    - docker:dind
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    GOCACHE: ${CI_PROJECT_DIR}/.cache/go-build
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # the ganache container port is published on the dind host, not localhost
    FAST_UPDATES_E2E_RPC_HOST: docker
  cache:
    key:
      files:
        - go-client/go.sum
      prefix: $CI_JOB_NAME
    paths:
      - .go/pkg/mod/
      - .cache/go-build/
  before_script:
    - mkdir -p ${GOPATH} ${GOCACHE}
    # docker CLI for the test harness, which manages its own ganache container
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-24.0.7.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
    - cd go-client
  script:
    # the client runs in-process in the scenarios, so this coverage reflects
    # what the release gate actually executes (generated bindings excluded)
    - go test ./tests/e2e/ -v -count=1 -timeout 45m -coverprofile=coverage-e2e.out -covermode=atomic -coverpkg=$(go list ./... | grep -v contracts-interface | paste -sd, -)
    - go tool cover -func=coverage-e2e.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - go-client/coverage-e2e.out
